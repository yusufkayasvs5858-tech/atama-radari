name: Atama Radari Otomatik Tarama

on:
  schedule:
    # 2 Saatte Bir Kesintisiz Otomatik Tarama (00:00, 02:00, 04:00 ... 22:00)
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'index.html'

concurrency:
  group: atama-radari-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bagimliliklari Yukle
        run: npm install --no-audit --no-fund

      - name: Otomatik Dogrulama ve Birim Testleri
        run: npm test

      - name: Resmi Kaynaklari Tara, Degerlendir ve Bildir
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_PROFILE_JSON: ${{ secrets.USER_PROFILE_JSON }}
        run: node scraper.js

      - name: Veritabani ve Raporlari Atomik Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Atama Radari Bot"
          git add ilanlar.json notified.json scan-report.json data/
          if git diff --staged --quiet; then
            echo "Kaydedilecek yeni degisiklik bulunmuyor."
          else
            git commit -m "Otomatik kamu ilani tarama ve analiz guncellemesi [skip ci]"
            # Uzak repodaki son degisiklikleri cek ve rebase et (cakisma durumunda taze taranan veriyi koru)
            git pull --rebase -X ours origin main || git pull --rebase origin main || true
            # Guvenli sekilde pushla, gerekirse force-with-lease veya force ile non-fast-forward engelini as
            git push origin main || git push --force-with-lease origin main || git push origin main --force
          fi
